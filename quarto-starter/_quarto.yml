project:
  type: website
  output-dir: docs        # GitHub Pages serves the site from this folder

execute:
  freeze: auto            # only re-run R code when a page's code changes

website:
  title: "Your Name"
  site-url: https://bnwaweru.github.io
  navbar:
    left:
      - href: index.qmd
        text: Home
      - projects.qmd
      - publications.qmd
      - conferences.qmd
      - travel.qmd
      - journey.qmd
    right:
      - icon: github
        href: https://github.com/bnwaweru
  page-footer:
    center: "Built with [Quarto](https://quarto.org) · Source on [GitHub](https://github.com/bnwaweru/bnwaweru.github.io)"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: false
